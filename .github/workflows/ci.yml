name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : la CI n'a besoin que de cloner le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, types & garde-fou réseau
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Installer les dépendances (dev only)
        run: npm ci
      - name: Tests (runner natif Node)
        run: npm test
      - name: Vérification des types (JSDoc + tsc --noEmit)
        run: npm run typecheck
      - name: Garde-fou « zéro réseau »
        run: npm run check:network

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Valider chaque commit de la PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            msg_file="$(mktemp)"
            git log -1 --format=%B "$sha" > "$msg_file"
            if ! sh .githooks/commit-msg "$msg_file"; then
              echo "  ↳ commit $sha" >&2
              status=1
            fi
          done
          exit $status
